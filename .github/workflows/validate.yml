name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # 'brands' se valide via une PR séparée sur home-assistant/brands.
          ignore: brands
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  import:
    name: Import (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"
            homeassistant: "2025.3.0"
          - python: "3.14"
            homeassistant: "2026.9.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # hassfest et l'action HACS valident les métadonnées et la structure du dépôt,
      # jamais le fait que le code s'importe : la 0.1.0 est passée au vert alors
      # qu'elle ne démarrait chez personne (issue #1). Ce job ferme ce trou.
      - run: pip install "homeassistant==${{ matrix.homeassistant }}"
      - name: Importer tous les modules de l'intégration
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, "custom_components")
          mods = ["sobry"] + [f"sobry.{f.stem}" for f in
                              sorted(pathlib.Path("custom_components/sobry").glob("*.py"))
                              if f.stem != "__init__"]
          for m in mods:
              importlib.import_module(m)
              print("ok", m)
          PY

  tests:
    name: Tests Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q
